<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shift Handover Pro — ATC Operations</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080B12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handover Pro">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --void:#080B12;
  --panel:#111828;
  --panel-raised:#182238;
  --panel-hi:#1E2A45;
  --line:#26314A;
  --line-soft:#1A2338;
  --text:#EAF0FA;
  --text-dim:#8C9AB8;
  --text-faint:#5C6B8A;
  --radar:#2BD9A8;
  --radar-dim:#17604C;
  --amber:#F5A623;
  --amber-dim:#5C4014;
  --red:#FF4D5E;
  --red-dim:#5C1A22;
  --blue:#4C8DFF;
  --blue-dim:#17325C;
  --radius:14px;
  --radius-sm:9px;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--void);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.01em;}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  background:
    radial-gradient(ellipse 600px 300px at 50% -10%, rgba(76,141,255,0.08), transparent),
    var(--void);
  display:flex;
  flex-direction:column;
}
@media (min-width:481px){
  body{background:#04060A;}
  #app{box-shadow:0 0 80px rgba(0,0,0,0.6);border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
}
.sidebar-brand{display:none;}
@media (min-width:900px){
  body.app-shell #app{max-width:100%;border:none;box-shadow:none;}
  body.app-shell .topbar{margin-left:250px;padding-left:36px;padding-right:36px;}
  body.app-shell .screen{margin-left:250px;padding-left:36px;padding-right:36px;max-width:960px;padding-bottom:48px;}
  body.app-shell .bottomnav{
    position:fixed;top:0;left:0;right:auto;bottom:0;width:250px;max-width:250px;margin:0;
    flex-direction:column;align-items:stretch;justify-content:flex-start;
    padding:26px 14px;gap:4px;border-top:none;border-right:1px solid var(--line-soft);
    background:var(--panel);backdrop-filter:none;
  }
  body.app-shell .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 16px;border-radius:10px;font-size:13.5px;}
  body.app-shell .nav-item.active{background:var(--panel-hi);}
  body.app-shell .nav-item svg{width:19px;height:19px;}
  body.app-shell .sidebar-brand{
    display:flex;align-items:center;gap:10px;padding:8px 16px 22px;margin-bottom:10px;
    border-bottom:1px solid var(--line-soft);font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:15px;color:var(--text);
  }
  body.app-shell .overlay{align-items:center;}
  body.app-shell .sheet{max-width:520px;border-radius:20px;border-bottom:1px solid var(--line-soft);}
}

/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ---------- utility ---------- */
.screen{flex:1;display:flex;flex-direction:column;padding-bottom:96px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.px{padding-left:20px;padding-right:20px;}
.section-label{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:0.14em;
  color:var(--text-faint);text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--line-soft);}
.card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px;
}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

/* ---------- buttons ---------- */
.btn{
  border:none;border-radius:var(--radius-sm);padding:13px 18px;font-family:'Rajdhani',sans-serif;
  font-weight:700;font-size:15px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, filter .12s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--radar),#1EA787);color:#05130F;box-shadow:0 4px 20px rgba(43,217,168,0.25);}
.btn-secondary{background:var(--panel-hi);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:linear-gradient(135deg,var(--red),#D8323F);color:#fff;box-shadow:0 4px 20px rgba(255,77,94,0.25);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--panel-hi);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;flex-shrink:0;
}
.icon-btn:active{transform:scale(0.94);}

/* ---------- inputs ---------- */
label{font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:6px;}
input,select,textarea{
  width:100%;background:var(--panel-raised);border:1px solid var(--line);color:var(--text);
  border-radius:var(--radius-sm);padding:11px 12px;font-family:'Inter',sans-serif;font-size:14.5px;
  outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--radar);}
textarea{resize:vertical;min-height:80px;font-family:'Inter',sans-serif;}
.field{margin-bottom:14px;}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238C9AB8' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}

/* ---------- status dots ---------- */
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot-op{background:var(--radar);box-shadow:0 0 8px var(--radar);}
.dot-maint{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.dot-fault{background:var(--red);box-shadow:0 0 8px var(--red);}
.pill{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;
}
.pill-op{background:rgba(43,217,168,0.12);color:var(--radar);}
.pill-maint{background:rgba(245,166,35,0.12);color:var(--amber);}
.pill-fault{background:rgba(255,77,94,0.12);color:var(--red);}
.pill-blue{background:rgba(76,141,255,0.12);color:var(--blue);}
.pill-neutral{background:var(--panel-hi);color:var(--text-dim);}

/* ---------- login ---------- */
.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;position:relative;overflow:hidden;}
.radar-scope{
  width:180px;height:180px;margin:0 auto 22px;border-radius:50%;position:relative;
  background:radial-gradient(circle, rgba(43,217,168,0.05) 0%, transparent 70%);
  border:1px solid var(--line-soft);
}
.radar-scope::before,.radar-scope::after{
  content:'';position:absolute;border-radius:50%;border:1px solid var(--line-soft);
}
.radar-scope::before{inset:22px;}
.radar-scope::after{inset:44px;}
.radar-sweep{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  animation:spin 4s linear infinite;
}
.radar-sweep::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(43,217,168,0.55) 0deg, rgba(43,217,168,0) 55deg, transparent 360deg);
}
@keyframes spin{to{transform:rotate(360deg);}}
.logo-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.brand-title{text-align:center;font-size:28px;color:var(--text);margin-bottom:2px;}
.brand-sub{text-align:center;font-size:12.5px;color:var(--text-faint);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:34px;font-family:'Rajdhani',sans-serif;font-weight:600;}
.biometric-btn{
  width:64px;height:64px;border-radius:50%;background:var(--panel-hi);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin:18px auto 6px;cursor:pointer;color:var(--radar);
  transition:box-shadow .3s;
}
.biometric-btn.scanning{animation:pulseScan 1.1s ease-in-out infinite;}
@keyframes pulseScan{0%,100%{box-shadow:0 0 0 0 rgba(43,217,168,0.4);}50%{box-shadow:0 0 0 12px rgba(43,217,168,0);}}
.link-row{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;}
.link{color:var(--blue);text-decoration:none;cursor:pointer;background:none;border:none;font-size:13px;font-family:inherit;}
.emergency-fab{
  position:fixed;bottom:22px;right:calc(50% - 240px + 18px);z-index:40;
  background:var(--red);color:#fff;border:none;border-radius:30px;padding:12px 18px;
  display:flex;align-items:center;gap:8px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.04em;
  box-shadow:0 6px 24px rgba(255,77,94,0.4);cursor:pointer;font-size:13px;text-transform:uppercase;
}
@media (max-width:480px){.emergency-fab{right:18px;}}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(8,11,18,0.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);padding:16px 20px 14px;
}
.topbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.greet{font-size:20px;}
.greet-sub{font-size:12px;color:var(--text-faint);margin-top:2px;}
.avatar{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#2A5FCC);
  display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;color:#fff;cursor:pointer;flex-shrink:0;
}
.bell-wrap{position:relative;}
.bell-dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid var(--void);}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:480px;margin:0 auto;background:rgba(17,24,40,0.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  color:var(--text-faint);cursor:pointer;border:none;background:none;font-family:'Rajdhani',sans-serif;
  font-size:10.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;
}
.nav-item.active{color:var(--radar);}
.nav-item svg{width:21px;height:21px;}

/* ---------- flight strip ---------- */
.strip{
  background:var(--panel);border:1px solid var(--line-soft);border-left:4px solid var(--radar);
  border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer;
}
.strip.arr{border-left-color:var(--blue);}
.strip.dep{border-left-color:var(--radar);}
.strip.delayed{border-left-color:var(--amber);}
.strip.vip{border-left-color:#C78CFF;}
.strip-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.strip-call{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:0.02em;}
.strip-meta{font-size:12px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap;}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:4px;margin-bottom:18px;}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;color:var(--text-faint);border:none;background:none;}
.tab.active{background:var(--panel-hi);color:var(--radar);}

/* ---------- emergency grid ---------- */
.emg-btn{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:18px 10px;
  display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;color:var(--text);
  transition:border-color .15s,background .15s;
}
.emg-btn:active{background:var(--panel-hi);}
.emg-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,77,94,0.12);color:var(--red);}
.emg-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;text-align:center;letter-spacing:0.02em;}

/* ---------- modal / sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,6,10,0.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;}
.sheet{
  background:var(--panel);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  border:1px solid var(--line-soft);border-bottom:none;max-height:88vh;overflow-y:auto;
  padding:10px 20px 30px;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 16px;}

/* ---------- toast ---------- */
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--panel-hi);border:1px solid var(--line);border-left:3px solid var(--radar);
  color:var(--text);padding:12px 18px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,0.5);
  animation:toastIn .22s ease; max-width:90%;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px);}to{opacity:1;transform:translate(-50%,0);}}

/* ---------- misc ---------- */
.hr{height:1px;background:var(--line-soft);margin:16px 0;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel-raised);font-size:12.5px;color:var(--text-dim);cursor:pointer;}
.chip.on{background:var(--radar-dim);border-color:var(--radar);color:var(--radar);}
.checkbox-toggle{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel-raised);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.checkbox-toggle.on{background:var(--radar);border-color:var(--radar);}
.eq-select{display:flex;gap:6px;}
.eq-opt{flex:1;text-align:center;padding:7px 4px;border-radius:8px;border:1px solid var(--line);font-size:11px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;color:var(--text-faint);}
.eq-opt.op.on{background:var(--radar-dim);border-color:var(--radar);color:var(--radar);}
.eq-opt.maint.on{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
.eq-opt.offline.on{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.sig-canvas{width:100%;height:110px;background:var(--panel-raised);border:1px dashed var(--line);border-radius:10px;touch-action:none;}
.big-stat{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:30px;line-height:1;}
.notif-item{padding:13px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex-shrink:0;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}

/* ---------- utc bar / movement badges / shift log / briefing ---------- */
.utc-bar{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--radar);letter-spacing:0.03em;}
.airport-line{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12.5px;color:var(--text-dim);letter-spacing:0.03em;text-transform:uppercase;}
.airport-line .sep{color:var(--text-faint);}
.utc-bar .sep{color:var(--text-faint);}
.utc-login{text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--radar);letter-spacing:0.04em;margin-bottom:18px;}
.pill-arr{background:rgba(76,141,255,0.12);color:var(--blue);}
.pill-dep{background:rgba(43,217,168,0.12);color:var(--radar);}
.pill-div{background:rgba(245,166,35,0.12);color:var(--amber);}
.tabs.tabs4 .tab{font-size:11px;padding:9px 2px;}
.tabs-scroll{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:4px;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs-scroll::-webkit-scrollbar{display:none;}
.tabs-scroll .tab{flex:0 0 auto;padding:9px 16px;white-space:nowrap;font-size:12px;}
.flog-table{width:100%;border-collapse:collapse;font-size:12px;}
.flog-table th{text-align:left;color:var(--text-faint);font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;font-size:10.5px;padding:6px 6px;border-bottom:1px solid var(--line-soft);}
.flog-table td{padding:8px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
.flog-table td.desc{font-family:'Inter',sans-serif;color:var(--text-dim);}
.worklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.worklist-item .x{margin-left:auto;color:var(--text-faint);cursor:pointer;flex-shrink:0;}
.shift-card{background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--blue);border-radius:10px;padding:13px 14px;margin-bottom:10px;}
.shift-card.open{border-left-color:var(--radar);}
.add-row{display:flex;gap:8px;margin-top:10px;}
.add-row input{flex:1;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
const state = {
  screen:'login',
  loggedIn:false,
  profile:null,
  handoverTab:'create',
  draft:null,
  showAddNotam:false,
  handoverDetail:null,
  showForgot:false,
  showEmergencyContacts:false,
  scanning:false,
  toastMsg:null,
  histFilterShift:'all',
  histFilterDate:'',
  loginPosition:'ATC Tower',
  activeShiftLog:null,
  showLogoutConfirm:false,
  briefing:null,
  newWorkText:'',
  newSchedule:{time:'',position:'ATC Tower',controller:''},
  editingProfile:false,
  showQuickAddWork:false,
  workDetail:null,
  workLogDraft:{type:'Apron Work', startAt:'', endAt:'', callsign:'', registration:'', departure:'', destination:'', description:''},
};

/* ============================= SUPABASE CONFIG ============================= */
/* 1. Create a free project at https://supabase.com
   2. Run schema.sql (provided separately) in the SQL editor
   3. Paste your Project URL and anon public key below (Project Settings > API) */
const SUPABASE_URL = "https://ylmmuukwidgtejfqgjtw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Q7Nyy8uaL3T8BlPk2XC6zQ_gWs9LPuE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================= SHARED APP DATA (key/value table) ============================= */
async function getShared(key, fallback){
  try{
    const { data, error } = await sb.from('app_data').select('value').eq('key', key).maybeSingle();
    if(error || !data) return fallback;
    return data.value;
  }catch(e){ console.error(e); return fallback; }
}
async function setShared(key, value){
  try{
    await sb.from('app_data').upsert({ key, value, updated_at: new Date().toISOString() });
  }catch(e){ console.error(e); }
}

/* ============================= PROFILE (per-controller, tied to Supabase Auth) ============================= */
function mapProfile(row){
  if(!row) return null;
  return {
    controllerId: row.controller_id,
    name: row.name,
    employeeId: row.employee_id,
    role: row.role,
    shift: row.shift_schedule,

/* ============================= UTC (ZULU) CLOCK ============================= */
function formatUTC(){
  const n = new Date();
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const dd = String(n.getUTCDate()).padStart(2,'0');
  const mm = months[n.getUTCMonth()];
  const yyyy = n.getUTCFullYear();
  const hh = String(n.getUTCHours()).padStart(2,'0');
  const mi = String(n.getUTCMinutes()).padStart(2,'0');
  const ss = String(n.getUTCSeconds()).padStart(2,'0');
  return {date:`${dd} ${mm} ${yyyy}`, time:`${hh}:${mi}:${ss}Z`};
}
function startUtcClock(){
  setInterval(()=>{
    const t = formatUTC();
    document.querySelectorAll('.js-utc-time').forEach(el=> el.textContent = t.time);
    document.querySelectorAll('.js-utc-date').forEach(el=> el.textContent = t.date);
  },1000);
}

function normalizePosition(pos){
  if(!pos) return 'All';
  const p = pos.toLowerCase();
  if(p.includes('area')) return 'Area Control';
  if(p.includes('approach') || p.includes('radar')) return 'Approach Control';
  if(p.includes('tower') || p.includes('ground')) return 'ATC Tower';
  return 'All';
}

  const prefix = (email.split('@')[0]||'').toLowerCase();
  if(prefix.startsWith('area')) return 'Area Control';
  if(prefix.startsWith('approach')) return 'Approach Control';
  if(prefix.startsWith('tower')) return 'ATC Tower';
  return null;
}

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+' min ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.round(hrs/24)+'d ago';
}

function classifyWork(w, now){
  if(w.done) return 'done';
  if(!w.startAt && !w.endAt) return 'live';
  const start = w.startAt ? new Date(w.startAt) : null;
  const end = w.endAt ? new Date(w.endAt) : null;
  if(start && now < start) return 'upcoming';
  if(end && now > end) return 'expired';
  return 'live';
}
function liveWorkCard(){
  const b = dashCache.briefing;
  if(!b || !b.ongoingWork || b.ongoingWork.length===0) return '';
  const now = new Date();
  const items = b.ongoingWork.map((w,i)=>({...w, _idx:i, _status: classifyWork(w, now)}))
    .filter(w=> w._status!=='expired' && w._status!=='done');
  const live = items.filter(w=>w._status==='live');
  const upcoming = items.filter(w=>w._status==='upcoming');
  if(live.length===0 && upcoming.length===0) return '';
  return `
    <div class="section-label">Live &amp; Upcoming Work</div>
    <div class="card">
      ${live.map(w=>workRow(w,'pill-op','Live')).join('')}
      ${upcoming.map(w=>workRow(w,'pill-blue','Upcoming')).join('')}
    </div>
  `;
}

function eqDot(label,eq){
  const st = (eq && typeof eq==='object') ? eq.status : eq; // tolerate legacy plain-string values
  const validUntil = (eq && typeof eq==='object') ? eq.validUntil : null;
  const cls = st==='operational'?'dot-op':st==='maintenance'?'dot-maint':'dot-fault'; // dot-fault CSS retained (shared with safety alerts)
  // treat both 'offline' and any unrecognised value as the red dot
  const isExpired = validUntil && new Date(validUntil) < new Date();
  return `<div style="display:flex;flex-direction:column;gap:2px;">
    <div class="row" style="gap:6px;"><span class="dot ${cls}"></span><span style="font-size:12.5px;color:var(--text-dim);">${label}</span></div>
    ${validUntil? `<span style="font-size:10px;margin-left:15px;color:${isExpired?'var(--red)':'var(--text-faint)'};">${isExpired?'Expired ':'Until '}${new Date(validUntil).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
  </div>`;
}

let notamsCache = [];

function notamDT(dateStr,timeStr){
  if(!dateStr) return null;
  return new Date(dateStr+'T'+(timeStr||'00:00'));
}
function renderNotams(){
  const now = new Date();
  const sorted = [...notamsCache].sort((a,b)=> notamDT(a.startDate,a.startTime) - notamDT(b.startDate,b.startTime));
  return `
  ${shellTop('NOTAMs','Notices to Air Missions')}
  <div class="screen px">
    <div class="between" style="margin-top:26px;margin-bottom:10px;">
      <div class="section-label" style="margin:0;flex:1;">Active &amp; Upcoming (${notamsCache.length})</div>
      <button class="btn btn-secondary btn-sm" onclick="openAddNotam()">${icon('list',14)} Add</button>
    </div>
    ${sorted.length===0? `<div class="empty-state">${icon('flag',34)}<div style="margin-top:10px;">No NOTAMs logged.</div></div>` :
      sorted.map((n)=>{
        const start = notamDT(n.startDate,n.startTime);
        const end = notamDT(n.endDate,n.endTime);
        const isActive = start && end && now>=start && now<=end;
        const isExpired = end && now>end;
        const cls = isExpired ? 'delayed' : isActive ? 'dep' : 'arr';
        const statusLabel = isExpired ? 'Expired' : isActive ? 'Active' : 'Upcoming';
        const statusPill = isExpired ? 'pill-neutral' : isActive ? 'pill-op' : 'pill-blue';
        return `<div class="strip ${cls}">
          <div class="strip-top">
            <span class="strip-call" style="font-size:14px;">${n.startDate} ${n.startTime} → ${n.endDate} ${n.endTime}</span>
            <span class="pill ${statusPill}">${statusLabel}</span>
          </div>
          <div style="font-size:13.5px;color:var(--text-dim);margin-top:4px;">${n.description}</div>
        </div>`;
      }).join('')
    }
  </div>
  ${bottomNav()}
  ${state.showAddNotam? addNotamModal() : ''}
  `;
}

function toDatetimeLocal(iso){

  const d = new Date(iso);

  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* signature pad */
let sigState = {};
function initSignaturePads(){
  ['sigOut','sigIn'].forEach(id=>{
    const canvas = document.getElementById(id);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#2BD9A8'; ctx.lineWidth = 2; ctx.lineCap='round';
    let drawing=false, last=null;
    function pos(e){
      const r = canvas.getBoundingClientRect();
      const p = e.touches? e.touches[0] : e;
      return [(p.clientX-r.left)*(canvas.width/r.width), (p.clientY-r.top)*(canvas.height/r.height)];
    }
    function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
    function move(e){
      if(!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke();
      last=p;
      state.draft[id]=canvas.toDataURL();
      e.preventDefault();
    }
    function end(){ drawing=false; }
    canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
    canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
  });
}
function clearSig(id){
  const canvas = document.getElementById(id);
  if(canvas){ canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); }
  state.draft[id]=null;
}

      ${h.areaOps.enrouteConflicts?`<div style="font-size:13.5px;color:var(--text-dim);margin-top:-6px;margin-bottom:14px;">${h.areaOps.enrouteConflicts}</div>`:''}` : ''}
      <div class="section-label">Flight Ops</div>
      <div class="grid2">
        ${detailRow('Arrivals', h.flightOps.arrivals)}${detailRow('Departures', h.flightOps.departures)}
        ${detailRow('Delayed', h.flightOps.delayed)}${detailRow('Holding', h.flightOps.holding)}
      </div>
      ${h.pendingTasks.length?`<div class="section-label">Pending Tasks</div><div class="chip-row">${h.pendingTasks.map(t=>`<span class="chip on">${t}</span>`).join('')}</div>`:''}
      ${h.safetyAlerts.length?`<div class="section-label">Safety Alerts</div><div class="chip-row">${h.safetyAlerts.map(t=>`<span class="chip" style="border-color:var(--red);color:var(--red);">${t}</span>`).join('')}</div>`:''}
      ${h.remarks?`<div class="section-label">Remarks</div><div style="font-size:13.5px;color:var(--text-dim);">${h.remarks}</div>`:''}

      <div class="row" style="gap:10px;margin-top:22px;">
        <button class="btn btn-secondary btn-block" onclick="state.handoverDetail=null;render()">Close</button>
        <button class="btn btn-primary btn-block" onclick="exportReport()">${icon('download',16)} Export</button>

    </div>
  </div>`;
}
function exportReport(){
  window.print();
}

/* ============================= NOTIFICATIONS ============================= */
let notifCache = [];
async function loadNotifications(){
  const all = await getShared('notifications', []);
  const myPosition = normalizePosition(state.profile?.position);
  notifCache = all.filter(n => !n.targetPosition || n.targetPosition==='All' || n.targetPosition===myPosition);
  const hadUnread = notifCache.some(n=>!n.read);
  notifCache.forEach(n=>n.read=true);
  if(hadUnread) await setShared('notifications', all.map(n=> notifCache.find(v=>v.id===n.id) ? {...n, read:true} : n));
  render();
}
function renderNotifications(){
  const iconFor = t=> t==='handover'?'clipboard': t==='emergency'?'alert': t==='equipment'?'tool':'bell';
  return `
  ${shellTop('Notifications')}
  <div class="screen px">
    <button class="link" style="margin-bottom:10px;" onclick="goBackFromNotif()">${icon('back',14)} Back</button>
    ${notifCache.length===0? `<div class="empty-state">${icon('bell',34)}<div style="margin-top:10px;">You're all caught up.</div></div>` :
      notifCache.map(n=>`
      <div class="notif-item">
        <div class="icon-btn" style="background:var(--panel-hi);">${icon(iconFor(n.type),16)}</div>
        <div style="flex:1;">
          <div class="between"><span style="font-weight:600;font-size:13.5px;">${n.title}</span><span style="font-size:11px;color:var(--text-faint);">${n.time}</span></div>
          <div style="font-size:13px;color:var(--text-dim);margin-top:2px;">${n.message}</div>
        </div>
      </div>`).join('')
    }
  </div>
  `;
}
function goBackFromNotif(){ goto('dashboard'); }

/* ============================= PROFILE ============================= */
function renderProfile(){
  const p = state.profile || {};
  return `
  ${shellTop('Profile')}
  <div class="screen px">
    <div class="card" style="text-align:center;padding:26px 16px;">
      <div class="avatar" style="width:64px;height:64px;font-size:22px;margin:0 auto 12px;">${initials(p.name)}</div>
      <div class="disp" style="font-size:19px;">${p.name}</div>
      <div style="font-size:13px;color:var(--text-dim);">${p.role} · ${p.employeeId}</div>
    </div>

    <div class="between" style="margin-top:26px;margin-bottom:10px;">
      <div class="section-label" style="margin:0;flex:1;">Details</div>
      <button class="link" onclick="state.editingProfile=!state.editingProfile;render()">${state.editingProfile?'Cancel':'Edit'}</button>
    </div>
    ${state.editingProfile? `
    <div class="card">
      <div class="field"><label>Name</label><input type="text" id="pf-name" value="${p.name||''}"></div>
      <div class="field"><label>What should I call you?</label><input type="text" id="pf-nickname" value="${p.nickname||''}"></div>
      <div class="field"><label>Controller ID</label><input type="text" id="pf-cid" value="${p.controllerId||''}"></div>
      <div class="field"><label>Employee ID</label><input type="text" id="pf-emp" value="${p.employeeId||''}"></div>
      <div class="field"><label>Role</label><input type="text" id="pf-role" value="${p.role||''}"></div>
      <div class="field" style="margin-bottom:0;"><label>Shift Schedule</label><input type="text" id="pf-shift" value="${p.shift||''}"></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="saveProfileEdits()">${icon('check',15)} Save Changes</button>
    </div>
    ` : `
    <div class="card">
      ${detailRow('Preferred Name', p.nickname||firstName(p.name))}
      ${detailRow('Controller ID', p.controllerId)}
      ${detailRow('Employee ID', p.employeeId)}
      ${detailRow('Airport', AIRPORT_NAME+' ('+AIRPORT_CODE+')')}
      ${detailRow('Role', p.role)}
      ${detailRow('Control Position', p.position||'ATC Tower')}
      <div style="margin-bottom:0;">${detailRow('Shift Schedule', p.shift)}</div>
    </div>
    `}

    ${p.isAdmin ? `
    <div class="section-label">Manage Access <span class="pill pill-blue" style="margin-left:6px;">Admin</span></div>
    <div class="card">
      <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Only Gmail addresses on this list can sign in. Add your team's emails here.</div>
      <div id="allowlist-slot">${allowlistCache===null? '<div style="color:var(--text-faint);font-size:13px;">Loading…</div>' : allowlistCache.map(a=>`
        <div class="between" style="padding:9px 0;border-bottom:1px solid var(--line-soft);">
          <span class="mono" style="font-size:13px;">${a.email}</span>
          <span class="x" onclick="removeAllowedEmail('${a.email}')">${icon('back',13)}</span>
        </div>`).join('')}</div>
      <div class="add-row">
        <input type="email" placeholder="teammate@gmail.com" id="al-email">
        <button class="btn btn-secondary btn-sm" onclick="addAllowedEmail()">Add</button>
      </div>
    </div>
    ` : ''}

    <div class="section-label">Account</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-secondary btn-block" onclick="state.showChangePass=true;render()">${icon('lock',16)} Change Password</button>
      <button class="btn btn-danger btn-block" onclick="doLogout()">${icon('logout',16)} Logout</button>
    </div>
  </div>
  ${bottomNav()}
  ${state.showChangePass? changePassModal() : ''}
  `;
}
let allowlistCache = null;
async function loadAllowlist(){
  const { data } = await sb.from('allowed_emails').select('*').order('added_at', {ascending:false});
  allowlistCache = data || [];
  render();
}
async function addAllowedEmail(){
  const email = document.getElementById('al-email').value.trim().toLowerCase();
  if(!email){ return; }
  const { error } = await sb.from('allowed_emails').insert({ email, added_by: state.profile?.name || 'Admin' });
  if(error){ toast('Could not add — '+error.message); return; }
  toast('Access granted for '+email);
  document.getElementById('al-email').value = '';
  await loadAllowlist();
}
async function removeAllowedEmail(email){
  await sb.from('allowed_emails').delete().eq('email', email);
  toast('Access removed for '+email);
  await loadAllowlist();
}
async function saveProfileEdits(){
  const fields = {
    name: document.getElementById('pf-name').value.trim(),
    nickname: document.getElementById('pf-nickname').value.trim(),
    controllerId: document.getElementById('pf-cid').value.trim(),
    employeeId: document.getElementById('pf-emp').value.trim(),
    role: document.getElementById('pf-role').value.trim(),
    shift: document.getElementById('pf-shift').value.trim(),
  };
  await updateProfile(fields);
  state.profile = {...state.profile, ...fields};
  state.editingProfile = false;
  toast('Profile updated ✓');
  render();
}
function changePassModal(){
  return `<div class="overlay" onclick="if(event.target===this){state.showChangePass=false;render();}">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="disp" style="font-size:19px;margin-bottom:14px;">Change Password</div>
      <div class="field"><label>New Password</label><input type="password" id="cp-new" placeholder="At least 6 characters"></div>
      <div class="field" style="margin-bottom:0;"><label>Confirm New Password</label><input type="password" id="cp-conf"></div>
      <div id="cp-msg" style="font-size:12.5px;color:var(--red);margin-top:10px;display:none;"></div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="changePassword()">Update Password</button>
    </div>
  </div>`;
}
async function changePassword(){
  const nw = document.getElementById('cp-new').value;
  const conf = document.getElementById('cp-conf').value;
  const msg = document.getElementById('cp-msg');
  if(!nw || nw.length<6){ msg.style.display='block'; msg.textContent='Password must be at least 6 characters.'; return; }
  if(nw!==conf){ msg.style.display='block'; msg.textContent='Passwords do not match.'; return; }
  const { error } = await sb.auth.updateUser({ password: nw });
  if(error){ msg.style.display='block'; msg.textContent='Could not update password: '+error.message; return; }
  state.showChangePass=false;
  toast('Password updated ✓');
  render();
}

function firstName(name){
  if(!name) return 'Controller';
  return name.split(' ')[0];
}
function initials(name){
  if(!name) return 'AC';
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

/* ============================= MASTER RENDER ============================= */
function render(){
  let html = '';
  if(!state.loggedIn){
    html = renderLogin();
  } else {
    switch(state.screen){
      case 'dashboard': html = renderDashboard(); break;
      case 'notams': html = renderNotams(); break;
      case 'handover': html = renderHandover(); break;
      case 'profile': html = renderProfile(); break;
      case 'notifications': html = renderNotifications(); break;
      default: html = renderDashboard();
    }
  }
  if(state.showLogoutConfirm) html += logoutModal();
  if(state.toastMsg) html += `<div class="toast">${state.toastMsg}</div>`;
  document.body.classList.toggle('app-shell', state.loggedIn);
  document.getElementById('app').innerHTML = html;

  // post-render side effects (NOT data fetching — that happens only on navigation, see goto())
  if(state.loggedIn && state.screen==='handover' && state.handoverTab==='create'){ requestAnimationFrame(initSignaturePads); }
  updateBellIndicator();
}
async function updateBellIndicator(){
  const el = document.getElementById('bell-indicator');
  if(!el || !state.profile) return;
  const list = await getShared('notifications', []);
  const myPosition = normalizePosition(state.profile.position);
  const unread = list.filter(n=>!n.read && (!n.targetPosition || n.targetPosition==='All' || n.targetPosition===myPosition)).length;
  if(unread>0){ el.outerHTML = '<span class="bell-dot" id="bell-indicator-mark"></span>'; }
}
